version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Nested module: Dependabot resolves the parent hashicorp/nomad tag,
    # which does not contain the api package, and fails the whole
    # go_modules run. Managed manually until upstream tagging or
    # Dependabot handles nested modules.
    ignore:
      - dependency-name: "github.com/hashicorp/nomad/api"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
