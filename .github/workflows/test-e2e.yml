name: E2E Tests

# PR/push lane of the e2e matrix (neo-g1o / design review §2.10): runs
# the functional suite but SKIPS the slow containers — scale-down,
# version upgrade, leader failover — which run in nightly-e2e.yml.
#
# Callers can request the complete suite with `lane: full` (release.yml
# does, so releases gate on everything the nightly runs). Direct
# push/pull_request events always get the PR lane.
#
# Feature branches are covered by pull_request events; an unscoped push
# trigger would run the suite twice per push (neo-bf9).

on:
  push:
    branches: [main, stability]
  pull_request:
  workflow_call:
    inputs:
      lane:
        description: "'pr' skips the slow containers; 'full' runs the complete suite"
        type: string
        default: pr
    secrets:
      NOMAD_LICENSE:
        required: true
      VAULT_LICENSE:
        required: true
      # Cloud verification lanes skip cleanly when these are absent
      # (forks, credential-less callers).
      AZURE_CI_CLIENT_ID:
        required: false
      AZURE_CI_CLIENT_SECRET:
        required: false
      AZURE_CI_STORAGE_KEY:
        required: false
      AWS_CI_ACCESS_KEY_ID:
        required: false
      AWS_CI_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read
  checks: write

env:
  # Pinned: an unpinned 'latest' kind can break the gate on upstream
  # releases. Keep in step with nightly-e2e.yml.
  KIND_VERSION: v0.32.0

jobs:
  test-e2e:
    name: e2e on kind (${{ inputs.lane == 'full' && 'full suite' || 'PR lane' }})
    timeout-minutes: 100
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Write Nomad Enterprise license file
        env:
          NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
        run: |
          mkdir -p test/e2e/testdata
          echo "${NOMAD_LICENSE}" > test/e2e/testdata/nomad.hclic

      - name: Run e2e suite
        env:
          LANE: ${{ inputs.lane }}
          # The keyring specs deploy Vault Enterprise dev pods; the
          # suite feeds this into per-namespace vault-license Secrets.
          VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
          # Azure cloud lanes: specs skip when the secrets are empty.
          # Non-secret values name the dedicated CI vault/key/account
          # (vault-azure-infra: sp-nomad-ci, blast radius limited to
          # these resources).
          AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
          AZURE_CI_CLIENT_SECRET: ${{ secrets.AZURE_CI_CLIENT_SECRET }}
          AZURE_CI_STORAGE_KEY: ${{ secrets.AZURE_CI_STORAGE_KEY }}
          AZURE_CI_TENANT_ID: f41ba6d7-5897-4c86-8b5e-90aa354e6c48
          AZURE_CI_KV_NAME: kv-nomad-ci-orbital
          AZURE_CI_KEY_NAME: nomad-ci-keyring
          AZURE_CI_STORAGE_ACCOUNT: sanomadciorbital
          AZURE_CI_CONTAINER: nomad-ci-snapshots
          AWS_CI_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          AWS_CI_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          AWS_CI_KMS_KEY_ARN: arn:aws:kms:eu-west-2:745596511782:key/0c965e8b-87b1-4def-8b71-9465798c03d6
          AWS_CI_REGION: eu-west-2
        run: |
          go mod tidy
          # PR lane skips the slow containers (neo-g1o); lane=full clears
          # the skip so callers like release.yml run the complete suite.
          SKIP='scale-down|version upgrade|leader failover|Keyring lifecycle|Keyring transit auth|Keyring HA pair|Keyring resilience|Multi-namespace fleet|Minimal sample quickstart'
          if [ "${LANE}" = "full" ]; then SKIP=''; fi
          make test-e2e JUNIT_REPORT=e2e.xml GINKGO_SKIP="${SKIP}"

      # Dependabot-triggered runs get a read-only token that cannot
      # create check runs, so the report step is skipped for them.
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        with:
          name: E2E Test Results (${{ inputs.lane == 'full' && 'full suite' || 'PR lane' }})
          path: e2e.xml
          reporter: java-junit
          use-actions-summary: false

      - name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit
          path: e2e.xml
