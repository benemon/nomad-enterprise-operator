name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_TAG_BASE: quay.io/benjamin_holmes/nomad-enterprise-operator

jobs:
  # Releases must not ship a stale default operand. Fails when a newer
  # Nomad exists whose -ent image is published; the message says whether
  # the fix is a default bump (patch) or also a new upgrade-matrix pair
  # (minor). Ent tags can lag the OSS release, so a missing image is a
  # notice, not a failure.
  operand-currency:
    name: Operand version currency
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Compare default operand tag against latest Nomad release
        run: |
          default_version=$(sed -n 's/.*kubebuilder:default="\([0-9][0-9.]*\)-ent".*/\1/p' \
            api/v1alpha1/nomadcluster_types.go | head -1)
          if [ -z "$default_version" ]; then
            echo "::error::could not extract the default operand tag from nomadcluster_types.go"
            exit 1
          fi
          current_version=$(curl -fsS https://checkpoint-api.hashicorp.com/v1/check/nomad | jq -r .current_version)
          echo "default operand: ${default_version}-ent / latest Nomad: ${current_version}"
          if [ "$default_version" = "$current_version" ]; then
            echo "default operand is current"
            exit 0
          fi
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:hashicorp/nomad:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/hashicorp/nomad/manifests/${current_version}-ent")
          if [ "$code" != "200" ]; then
            echo "::notice::Nomad ${current_version} is out but hashicorp/nomad:${current_version}-ent is not on Docker Hub yet (HTTP ${code}); releasing with ${default_version}-ent"
            exit 0
          fi
          if [ "${default_version%.*}" = "${current_version%.*}" ]; then
            echo "::error::stale default operand: ${default_version}-ent pinned, ${current_version}-ent available (patch release — bump the default tag, regenerate manifests and the schema snapshot, update image assertions)"
          else
            echo "::error::stale default operand: ${default_version}-ent pinned, ${current_version}-ent available (new minor — bump the default tag AND append the consecutive upgrade-matrix pair in nightly-e2e.yml)"
          fi
          exit 1

  lint:
    needs: operand-currency
    uses: ./.github/workflows/lint.yml

  test:
    needs: lint
    uses: ./.github/workflows/test.yml
    # Called workflows request checks:write for the JUnit reporters; the
    # caller must grant it or the run fails at startup.
    permissions:
      contents: read
      checks: write

  test-e2e:
    needs: test
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read
      checks: write
    with:
      # Releases gate on the COMPLETE suite — scale-down, version
      # upgrade, leader failover — not the reduced PR lane (neo-bf9).
      lane: full
    secrets:
      NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
      VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
      AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
      AZURE_CI_CLIENT_SECRET: ${{ secrets.AZURE_CI_CLIENT_SECRET }}
      AZURE_CI_STORAGE_KEY: ${{ secrets.AZURE_CI_STORAGE_KEY }}
      AWS_CI_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
      AWS_CI_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}

  release:
    needs: test-e2e
    name: Build and Push Images
    timeout-minutes: 100
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the GitHub Release step below.
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Log in to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push operator image
        run: |
          make docker-buildx \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }} \
            PLATFORMS=linux/amd64,linux/arm64

      - name: Generate bundle
        run: |
          make bundle \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }} \
            VERSION=${{ env.VERSION }}

      - name: Build and push bundle image
        run: |
          make bundle-build bundle-push \
            BUNDLE_IMG=${{ env.IMAGE_TAG_BASE }}-bundle:v${{ env.VERSION }}

      - name: Build and push catalog image
        run: |
          make catalog-build catalog-push \
            CATALOG_IMG=${{ env.IMAGE_TAG_BASE }}-catalog:v${{ env.VERSION }} \
            BUNDLE_IMGS=${{ env.IMAGE_TAG_BASE }}-bundle:v${{ env.VERSION }}

      - name: Build installer manifest
        run: |
          make build-installer \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }}

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prerelease for any tag with a hyphenated qualifier (rc, beta).
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes ${PRERELEASE}

      - name: Upload installer manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/install.yaml \
            --repo "${GITHUB_REPOSITORY}" --clobber
