name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_TAG_BASE: quay.io/benjamin_holmes/nomad-enterprise-operator

permissions:
  contents: read

jobs:
  # Releases must not ship a stale default operand. Fails when a newer
  # Nomad exists whose -ent image is published; the message says whether
  # the fix is a default bump (patch) or also a new upgrade-matrix pair
  # (minor). Ent tags can lag the OSS release, so a missing image is a
  # notice, not a failure.
  operand-currency:
    name: Operand version currency
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare default operand tag against latest Nomad release
        run: |
          default_version=$(sed -n 's/.*kubebuilder:default="\([0-9][0-9.]*\)-ent".*/\1/p' \
            api/v1alpha1/nomadcluster_types.go | head -1)
          if [ -z "$default_version" ]; then
            echo "::error::could not extract the default operand tag from nomadcluster_types.go"
            exit 1
          fi
          current_version=$(curl -fsS https://checkpoint-api.hashicorp.com/v1/check/nomad | jq -r .current_version)
          echo "default operand: ${default_version}-ent / latest Nomad: ${current_version}"
          if [ "$default_version" = "$current_version" ]; then
            echo "default operand is current"
            exit 0
          fi
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:hashicorp/nomad:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/hashicorp/nomad/manifests/${current_version}-ent")
          if [ "$code" != "200" ]; then
            echo "::notice::Nomad ${current_version} is out but hashicorp/nomad:${current_version}-ent is not on Docker Hub yet (HTTP ${code}); releasing with ${default_version}-ent"
            exit 0
          fi
          if [ "${default_version%.*}" = "${current_version%.*}" ]; then
            echo "::error::stale default operand: ${default_version}-ent pinned, ${current_version}-ent available (patch release — bump the default tag, regenerate manifests and the schema snapshot, update image assertions)"
          else
            echo "::error::stale default operand: ${default_version}-ent pinned, ${current_version}-ent available (new minor — bump the default tag AND append the consecutive upgrade-matrix pair in nightly-e2e.yml)"
          fi
          exit 1

      - name: Compare default autoscaler tag against latest Nomad Autoscaler release
        run: |
          default_version=$(sed -n 's/.*kubebuilder:default="\([0-9][0-9.]*\)-ent".*/\1/p' \
            api/v1alpha1/nomadautoscaler_types.go | head -1)
          if [ -z "$default_version" ]; then
            echo "::error::could not extract the default autoscaler tag from nomadautoscaler_types.go"
            exit 1
          fi
          current_version=$(curl -fsS https://checkpoint-api.hashicorp.com/v1/check/nomad-autoscaler | jq -r .current_version)
          echo "default autoscaler: ${default_version}-ent / latest Nomad Autoscaler: ${current_version}"
          if [ "$default_version" = "$current_version" ]; then
            echo "default autoscaler is current"
            exit 0
          fi
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:hashicorp/nomad-autoscaler-enterprise:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/hashicorp/nomad-autoscaler-enterprise/manifests/${current_version}-ent")
          if [ "$code" != "200" ]; then
            echo "::notice::Nomad Autoscaler ${current_version} is out but hashicorp/nomad-autoscaler-enterprise:${current_version}-ent is not on Docker Hub yet (HTTP ${code}); releasing with ${default_version}-ent"
            exit 0
          fi
          echo "::error::stale default autoscaler: ${default_version}-ent pinned, ${current_version}-ent available (bump the default tag in nomadautoscaler_types.go, regenerate manifests and the schema snapshot, update image assertions)"
          exit 1

  lint:
    needs: operand-currency
    uses: ./.github/workflows/lint.yml

  test:
    needs: lint
    uses: ./.github/workflows/test.yml
    # Called workflows request checks:write for the JUnit reporters; the
    # caller must grant it or the run fails at startup.
    permissions:
      contents: read
      checks: write

  test-e2e:
    needs: test
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read
      checks: write
    with:
      # Releases gate on the COMPLETE suite — scale-down, version
      # upgrade, leader failover — not the reduced PR lane (neo-bf9).
      lane: full
    secrets:
      NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
      VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
      AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
      AZURE_CI_CLIENT_SECRET: ${{ secrets.AZURE_CI_CLIENT_SECRET }}
      AZURE_CI_STORAGE_KEY: ${{ secrets.AZURE_CI_STORAGE_KEY }}
      AWS_CI_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
      AWS_CI_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}

  release:
    needs: test-e2e
    name: Build and Push Images
    timeout-minutes: 100
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the GitHub Release step below.
      contents: write
      packages: write
      id-token: write       # keyless cosign signing + provenance
      attestations: write   # build-provenance attestations
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags so cyclonedx-gomod can derive the module
          # version from the tag when generating the SBOM.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate SBOM
        run: |
          mkdir -p dist
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.11.0 \
            app -json -licenses -main cmd -output dist/nomad-enterprise-operator.cdx.json .
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push operator image
        run: |
          make docker-buildx \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }} \
            PLATFORMS=linux/amd64,linux/arm64

      - name: Generate bundle
        run: |
          make bundle \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }} \
            VERSION=${{ env.VERSION }}

      - name: Build and push bundle image
        run: |
          make bundle-build bundle-push \
            BUNDLE_IMG=${{ env.IMAGE_TAG_BASE }}-bundle:v${{ env.VERSION }}

      - name: Build and push catalog image
        run: |
          make catalog-build catalog-push \
            CATALOG_IMG=${{ env.IMAGE_TAG_BASE }}-catalog:v${{ env.VERSION }} \
            BUNDLE_IMGS=${{ env.IMAGE_TAG_BASE }}-bundle:v${{ env.VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signatures over the operator, bundle and catalog image digests.
      # Verify with:
      #   cosign verify quay.io/benjamin_holmes/nomad-enterprise-operator:<tag> \
      #     --certificate-identity-regexp '^https://github.com/benemon/nomad-enterprise-operator/\.github/workflows/release\.yml@' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the release images
        env:
          IMG: ${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }}
          BUNDLE: ${{ env.IMAGE_TAG_BASE }}-bundle:v${{ env.VERSION }}
          CATALOG: ${{ env.IMAGE_TAG_BASE }}-catalog:v${{ env.VERSION }}
        run: |
          for ref in "$IMG" "$BUNDLE" "$CATALOG"; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
            [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "no digest for $ref"; exit 1; }
            cosign sign --yes "${ref%:*}@${digest}"
          done

      # Resolve the pushed operator image digest so the attestation binds to it
      # (read back from the registry rather than assumed).
      - name: Resolve operator image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          [ -n "$digest" ] && [ "$digest" != "null" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed build provenance for the operator image, stored in the
      # repository's attestation store. Verify with:
      #   gh attestation verify oci://<image>:<tag> -R benemon/nomad-enterprise-operator
      - name: Attest operator image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_TAG_BASE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
      - name: Build installer manifest
        run: |
          make build-installer \
            IMG=${{ env.IMAGE_TAG_BASE }}:v${{ env.VERSION }}

      - name: Attest installer manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/install.yaml
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prerelease for any tag with a hyphenated qualifier (rc, beta).
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes ${PRERELEASE}

      - name: Upload installer manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/install.yaml \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/nomad-enterprise-operator.cdx.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
