name: Nightly E2E (full matrix)

# Nightly lane of the e2e matrix (neo-g1o / design review §2.10): the
# COMPLETE suite including the slow containers the PR lane skips —
# Raft scale-down/up, the Nomad N->N+1 version upgrade, and operator
# leader failover. Also runnable on demand via workflow_dispatch
# (pre-release gate).
#
# OpenShift coverage is envtest-only by design (§2.10.1); the Route/
# ServiceMonitor object shapes are asserted there, not here.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  # Pinned: an unpinned 'latest' kind can break the gate on upstream
  # releases. Keep in step with test-e2e.yml.
  KIND_VERSION: v0.32.0

jobs:
  nightly-e2e:
    name: Full suite on kind
    timeout-minutes: 100
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Write Nomad Enterprise license file
        env:
          NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
        run: |
          mkdir -p test/e2e/testdata
          echo "${NOMAD_LICENSE}" > test/e2e/testdata/nomad.hclic

      - name: Run the full e2e suite
        env:
          # The keyring specs deploy Vault Enterprise dev pods; the
          # suite feeds this into per-namespace vault-license Secrets.
          VAULT_LICENSE: ${{ secrets.VAULT_LICENSE }}
          # Azure cloud lanes; specs skip when the secrets are empty.
          AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
          AZURE_CI_CLIENT_SECRET: ${{ secrets.AZURE_CI_CLIENT_SECRET }}
          AZURE_CI_STORAGE_KEY: ${{ secrets.AZURE_CI_STORAGE_KEY }}
          AZURE_CI_TENANT_ID: f41ba6d7-5897-4c86-8b5e-90aa354e6c48
          AZURE_CI_KV_NAME: kv-nomad-ci-orbital
          AZURE_CI_KEY_NAME: nomad-ci-keyring
          AZURE_CI_STORAGE_ACCOUNT: sanomadciorbital
          AZURE_CI_CONTAINER: nomad-ci-snapshots
          AWS_CI_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          AWS_CI_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          AWS_CI_KMS_KEY_ARN: arn:aws:kms:eu-west-2:745596511782:key/0c965e8b-87b1-4def-8b71-9465798c03d6
          AWS_CI_REGION: eu-west-2
        run: |
          go mod tidy
          # 'version upgrade' is skipped here because the upgrade-matrix
          # job below runs it per consecutive-minor pair — the suite's
          # default pair duplicates the matrix's newest entry (neo-bf9).
          make test-e2e JUNIT_REPORT=e2e-nightly.xml GINKGO_SKIP='version upgrade'

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: E2E Test Results (nightly full suite)
          path: e2e-nightly.xml
          reporter: java-junit
          use-actions-summary: false

      - name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-nightly-junit
          path: e2e-nightly.xml

  upgrade-matrix:
    name: Upgrade ${{ matrix.upgrade.from }} -> ${{ matrix.upgrade.to }}
    timeout-minutes: 100
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upgrade:
          # Consecutive minors only (Nomad supports one upgrade step at
          # a time). Major.minor tags serve the latest patch of each
          # line, so every pair is HashiCorp's recommended
          # latest-patch-to-latest-patch path and the matrix
          # self-maintains as patch releases ship. Append a new pair
          # when a new minor GAs.
          - { from: "1.10-ent", to: "1.11-ent" }
          - { from: "1.11-ent", to: "2.0-ent" }
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Write Nomad Enterprise license file
        env:
          NOMAD_LICENSE: ${{ secrets.NOMAD_LICENSE }}
        run: |
          mkdir -p test/e2e/testdata
          echo "${NOMAD_LICENSE}" > test/e2e/testdata/nomad.hclic

      - name: Run the upgrade container for this pair
        run: |
          go mod tidy
          make test-e2e GINKGO_FOCUS='version upgrade' \
            JUNIT_REPORT=e2e-upgrade.xml \
            UPGRADE_FROM='${{ matrix.upgrade.from }}' \
            UPGRADE_TO='${{ matrix.upgrade.to }}'

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: E2E Test Results (upgrade ${{ matrix.upgrade.from }} to ${{ matrix.upgrade.to }})
          path: e2e-upgrade.xml
          reporter: java-junit
          use-actions-summary: false

      - name: Upload test report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-upgrade-${{ matrix.upgrade.from }}-to-${{ matrix.upgrade.to }}-junit
          path: e2e-upgrade.xml
