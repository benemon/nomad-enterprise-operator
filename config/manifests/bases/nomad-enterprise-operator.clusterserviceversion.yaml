apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Modernization & Migration, Integration & Delivery
    containerImage: quay.io/benjamin_holmes/nomad-enterprise-operator:v0.0.1
    description: Community operator for HashiCorp Nomad Enterprise on Kubernetes and
      OpenShift - server clusters, Raft snapshots, and managed autoscaler agents.
      Not maintained or supported by HashiCorp.
    olm.skipRange: '>=0.1.0 <SKIP_RANGE_UPPER_BOUND'
    operatorframework.io/suggested-namespace: nomad-enterprise-operator-system
    operators.operatorframework.io/builder: operator-sdk-v1.42.0
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: nomad-enterprise-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: NomadAutoscaler is the Schema for the nomadautoscalers API.
      displayName: Nomad Autoscaler
      kind: NomadAutoscaler
      name: nomadautoscalers.nomad.hashicorp.com
      version: v1alpha1
    - description: NomadCluster is the Schema for the nomadclusters API.
      displayName: Nomad Cluster
      kind: NomadCluster
      name: nomadclusters.nomad.hashicorp.com
      version: v1alpha1
    - description: |-
        NomadSnapshot is the Schema for the nomadsnapshots API.

        spec.clusterRef is immutable: retargeting would orphan the old
        cluster's ACL policy and token (status.tokenAccessorID is only
        checked against the new cluster). Delete and recreate to retarget —
        the finalizer then cleans up the old credentials.
      displayName: Nomad Snapshot
      kind: NomadSnapshot
      name: nomadsnapshots.nomad.hashicorp.com
      version: v1alpha1
  description: |
    The Nomad Enterprise Operator is a community project that automates the
    deployment and lifecycle management of HashiCorp Nomad Enterprise server
    clusters on Kubernetes and OpenShift.

    This operator is not maintained or supported by HashiCorp. The
    nomad.hashicorp.com API group is a structural identifier, not an
    endorsement.

    Features include TLS certificate management, ACL bootstrap, gossip
    encryption, Prometheus monitoring, OpenShift Routes, persistent storage,
    automated snapshots, and managed Nomad Autoscaler agents (horizontal
    application scaling and Dynamic Application Sizing).
  displayName: Nomad Enterprise Operator
  icon:
  - base64data: 
    mediatype: image/svg+xml
  install:
    spec:
      deployments:
      - name: controller-manager
        spec:
          selector: null
          strategy: {}
          template:
            metadata: {}
            spec:
              containers: null
    strategy: deployment
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: true
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - nomad
  - orchestration
  - openshift
  links:
  - name: Source Code
    url: https://github.com/benemon/nomad-enterprise-operator
  - name: Nomad Documentation
    url: https://developer.hashicorp.com/nomad
  maintainers:
  - email: benjamin.holmes@gmail.com
    name: benemon
  maturity: alpha
  minKubeVersion: 1.28.0
  provider:
    name: benemon
    url: https://github.com/benemon
  version: 0.0.0
